<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Órbita · seu tempo, em vista</title><link rel="stylesheet" href="styles.css?v=20261016-5"></head>
<body><aside class="edge left"><nav aria-label="Páginas"><a class="brand" href="#agenda" title="Órbita">◉</a><button data-page="clock" title="Relógio (1)">◷<span>Relógio</span></button><button data-page="agenda" title="Agenda (2)">▦<span>Agenda</span></button><button data-page="settings" title="Configurações (3)">⚙<span>Ajustes</span></button><hr><button id="fullscreen" title="Alternar tela cheia (F)">⛶<span>Tela cheia</span></button></nav></aside>
<aside class="edge right"><div class="brightness"><span>☼</span><input id="brightness" aria-label="Brilho da página" type="range" min="15" max="100" value="100"><small id="brightness-value">100%</small></div></aside>
<main id="app"></main><div id="dimmer"></div><div id="toast" role="status"></div>
<dialog id="editor"><form id="item-form"><header><div><small>UM ESPAÇO PARA O QUE IMPORTA</small><h2 id="editor-title">Novo item</h2></div><button type="button" data-close aria-label="Fechar">×</button></header><input type="hidden" name="id"><label>Título<input name="title" required maxlength="160" placeholder="O que está nos seus planos?"></label><div class="fields"><label>Tipo<select name="type"><option value="task">Tarefa</option><option value="event">Evento</option><option value="goal">Meta</option><option value="reminder">Lembrete</option></select></label><label>Categoria<select name="category"><option value="personal">Pessoal</option><option value="work">Trabalho</option><option value="study">Faculdade</option><option value="health">Saúde</option></select></label></div><div class="fields"><label>Dia<input name="date" type="date" required></label><label>Horário opcional<input name="time" type="time"></label><label>Até<input name="endTime" type="time"></label></div><div class="fields"><label>Prioridade<select name="priority"><option value="normal">Normal</option><option value="high">Alta</option><option value="low">Baixa</option></select></label><label>Cor<input name="color" type="color" value="#b6c99b"></label><label>Emoji<input name="emoji" maxlength="16" placeholder="Sem emoji" autocomplete="off"></label></div><div id="emoji-picker" class="emojis" aria-label="Escolher emoji"></div><label>Notas<textarea name="notes" maxlength="2000" rows="2" placeholder="Detalhes, local ou próximos passos…"></textarea></label><div class="fields goal-fields"><label>Progresso da meta<input name="progress" type="number" min="0" max="100" value="0"></label><span class="muted">0 a 100%</span></div><footer><button type="button" id="delete-item" class="danger">Excluir</button><button type="button" data-close>Cancelar</button><button class="primary" type="submit">Salvar item ↗</button></footer></form></dialog>
<dialog id="import-dialog"><header><h2>Conferir importação</h2><button data-close aria-label="Fechar">×</button></header><div id="import-summary"></div><p class="muted">Novos itens serão adicionados. IDs existentes serão ignorados. Nenhum item atual será apagado.</p><footer><button data-close>Cancelar</button><button id="confirm-import" class="primary">Importar itens</button></footer></dialog>
<dialog id="auth-dialog"><form id="auth-form"><header><h2>Sua conta</h2><button type="button" data-close aria-label="Fechar">×</button></header><p class="muted" id="auth-info"></p><button type="button" id="google-login" class="primary wide">Continuar com Google</button><p class="separator">ou use seu e-mail</p><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="password" type="password" minlength="6" required autocomplete="current-password"></label><footer><button type="button" id="register">Criar conta</button><button type="submit" class="primary">Entrar</button></footer><button type="button" id="reset-password" class="text-button">Recuperar senha</button></form></dialog>
<input id="import-file" type="file" accept="application/json,.json" hidden><script type="module" src="app.js?v=20261016-2"></script></body></html>
